type Trip @model @auth(rules: [{allow: owner}, {allow: groups, groups: ["admin"]}]) {
  id: ID!
  title: String!
  destination: String!
  startDate: AWSDate
  endDate: AWSDate
  notes: [Note] @hasMany
  photos: [Photo] @hasMany
}

type Note @model @auth(rules: [{allow: owner}, {allow: groups, groups: ["admin"]}]) {
  id: ID!
  tripID: ID! @index(name: "byTrip")
  body: String!
}

type Photo @model @auth(rules: [{allow: owner}, {allow: groups, groups: ["admin"]}]) {
  id: ID!
  tripID: ID! @index(name: "byTrip")
  s3Key: String!
  caption: String
}

type PublicAnnouncement @model {
  id: ID!
  message: String!
  postedAt: AWSDateTime
}
